blank_issues_enabled: false
contact_links:
  - name: Report a vulnerability in the scanner
    url: https://github.com/bawbel/scanner/blob/main/SECURITY.md
    about: >-
      Security issues in bawbel-scanner itself. Report privately per SECURITY.md,
      never in a public issue.
  - name: Propose a new AVE record
    url: https://github.com/aveproject/ave
    about: >-
      AVE is an independent project (aveproject/ave, aveproject.org@gmail.com). A new
      class of agentic vulnerability starts as an AVE record there, before any detection
      rule here.
